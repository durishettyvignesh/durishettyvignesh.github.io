<html lang="en">
<head>

<style>
:root{--f:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--lime:#E2FF5A;--bg:#FFFFFF;--surf:#F3F3F3;--ink:#171717;--mute:#737373;--line:#E5E5E5;--soft:#F0F0F0;--blk:#171717;--on:#FAFAFA;--dim:#A3A3A3;--bl:#262626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surf:#0F0F0F;--ink:#FAFAFA;--mute:#8A8A8A;--line:#262626;--soft:#1F1F1F;--blk:#171717;--on:#FAFAFA;--dim:#8A8A8A;--bl:#373737}}
:root[data-theme="dark"]{--bg:#000;--surf:#0F0F0F;--ink:#FAFAFA;--mute:#8A8A8A;--line:#262626;--soft:#1F1F1F;--blk:#171717;--on:#FAFAFA;--dim:#8A8A8A;--bl:#373737}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.65 var(--f)}
a{color:inherit}
.dsp{font-family:var(--f);font-weight:500;letter-spacing:-.05em;line-height:1}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
body.home header,body.home footer,.fab{display:none}
body.home .fab{display:grid}
.bar{max-width:920px;margin:auto;padding:12px 24px;display:flex;gap:20px;align-items:center}
.logo{font-weight:600;text-decoration:none;white-space:nowrap}
nav{min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav a{padding:5px 12px;border-radius:99px;text-decoration:none;color:var(--mute);font-size:13px;font-weight:500;white-space:nowrap}
nav a.on{background:var(--ink);color:var(--bg)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{max-width:920px;margin:auto;padding:32px 24px 80px}
body.home main{padding-bottom:140px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:13px;color:var(--mute);background:var(--surf);border-radius:99px;padding:10px 22px;margin-bottom:28px}
.meta span:last-child{text-align:right}
h1{margin:0 0 12px;font-size:clamp(38px,9vw,88px)}
h1.big{font-size:clamp(40px,13vw,132px)}
h2{font-size:12px;text-transform:uppercase;font-weight:500;color:var(--mute);margin:44px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0 0 12px;max-width:62ch}
.lead{font-size:17px;color:var(--mute);max-width:52ch;margin:16px 0 0}
.mute{color:var(--mute)}.s{font-size:13px}
.feat{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:8px}

.dk{background:var(--blk);color:var(--on);border-radius:32px;padding:24px;border:1px solid var(--bl)}

.num{font-weight:500;line-height:.9;letter-spacing:-.06em}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 0;border-top:1px solid var(--bl)}

.rows .v{font:500 21px/1 var(--f);letter-spacing:-.03em}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:99px;background:var(--on);color:#171717;text-decoration:none;font-weight:600;font-size:14px;border:0;margin:6px 8px 0 0;cursor:pointer}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--surf);border:0;border-radius:28px;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:11px;padding:3px 11px;border-radius:99px;background:var(--lime);color:#171717;text-transform:uppercase}
.tl{position:relative;padding-left:32px}
.tl:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.st{position:relative;padding:0 0 28px}
.st:before{content:"";position:absolute;left:-32px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--blk);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--blk)}
.st.now:before{background:var(--bg)}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
ul.l{margin:8px 0 0;padding-left:18px;color:var(--mute)}ul.l li{margin-bottom:3px}

.ln{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.tile{aspect-ratio:1;border:1px dashed var(--line);border-radius:28px;display:grid;place-items:center;color:var(--mute);font-size:13px}

footer{max-width:920px;margin:auto;padding:0 24px 32px;color:var(--mute);font-size:12px;text-transform:uppercase}
.tg{display:flex;background:var(--soft);border-radius:99px;padding:3px;gap:2px;flex:none}
.tg button{border:0;background:none;color:var(--mute);font:500 12px var(--f);padding:5px 12px;border-radius:99px;cursor:pointer}
.tg button.on{background:var(--ink);color:var(--bg)}
.tg.fx{display:none}
body.home .tg.fx{display:flex;position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:8}
.fab{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:72px;height:72px;border-radius:50%;background:var(--blk);color:var(--on);border:0;cursor:pointer;z-index:10;place-items:center;font:500 12px var(--f)}
.fab:before{content:"";position:absolute;inset:-8px;border:1.5px dashed var(--mute);border-radius:50%}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.ov.open{opacity:1;visibility:visible}
.orb{position:absolute;left:50%;top:50%;border:1px solid var(--line);border-radius:50%;transform:translate(-50%,-50%) scale(.3);transition:transform .6s cubic-bezier(.2,.9,.3,1)}
.ov.open .orb{transform:translate(-50%,-50%) scale(1)}
.core{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px;border-radius:50%;background:var(--blk);color:var(--on);border:0;font-size:26px;cursor:pointer}
.it{position:absolute;left:50%;top:50%;padding:10px 16px;border-radius:99px;background:var(--blk);color:var(--on);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transform:translate(-50%,-50%) scale(.2);transition:transform .55s cubic-bezier(.2,.9,.3,1.25) calc(var(--i)*40ms),opacity .3s calc(var(--i)*40ms),background .2s,color .2s}

.it:hover{background:var(--ink);color:var(--bg)}

#mx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .6s}
main,footer{position:relative;z-index:1}
header{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.home{cursor:pointer}
.hm{min-height:calc(100svh - 190px);display:flex;flex-direction:column;justify-content:center}

.soc{display:flex;flex-wrap:wrap;gap:18px 34px;margin-top:38px}
.chip{display:flex;flex-direction:column;gap:9px;text-decoration:none;color:var(--mute);font-size:12px;text-shadow:0 0 10px var(--bg)}
.chip svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chip:hover{color:var(--ink)}
.dk .btn.o{color:var(--on);border-color:var(--bl)}
.emb{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:32px}
.emb iframe{width:100%;height:520px;border:0;border-radius:16px;background:#fff;margin-top:14px;display:block}
.emb .pinw{margin-top:14px;overflow:auto;max-height:540px}
.pv{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
.pv.open{display:flex}
.pvb{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvb .btn{margin:0 0 0 8px}
.pv iframe{flex:1;border:0;width:100%}
.bulb{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--blk);color:var(--on);border:1px solid var(--bl);display:grid;place-items:center;z-index:9;cursor:pointer;padding:0}
.bulb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:fill .3s,color .3s}
.bulb.lit svg{fill:var(--lime);color:var(--lime)}
.soc{gap:12px}
.chip{width:clamp(44px,11vw,56px);height:clamp(44px,11vw,56px);border-radius:50%;border:1px solid var(--line);align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent);transition:background .2s,transform .2s}
.chip:hover{background:var(--ink);transform:translateY(-3px)}.chip:hover svg{stroke:var(--bg)}
.fab{width:clamp(60px,10vmin,76px);height:clamp(60px,10vmin,76px)}
.ov{background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.it{width:var(--s);height:var(--s);padding:2px;border-radius:50%;display:grid;place-items:center;text-align:center;white-space:normal;overflow-wrap:anywhere;font-size:calc(var(--s)*.15);line-height:1.1;letter-spacing:-.03em}
.core{width:var(--s);height:var(--s);margin:calc(var(--s)/-2)}
.orb{border-style:dashed}
@media(min-width:1200px){.bar,main,footer{max-width:1080px}}
@media(max-width:720px){nav{display:none}.fab{display:grid}main{padding:24px 18px 130px}.bar{padding:12px 18px}.dk{border-radius:24px;padding:20px}.card{border-radius:22px;padding:18px}.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}.emb iframe{height:460px}.tile{border-radius:20px}}
</style>

<script>
const PG=[["home","Home"],["education","Education"],["research","Research"],["linkedin","LinkedIn"],["artworks","Artworks"],["projects","Side projects"],["credentials","Credentials"],["resume","Resume"],["experience","Internships"]];
const RAD=PG.slice(1).map(x=>x[0]=="projects"?[x[0],"Projects"]:x);

/* ===== EDIT THESE ===== */
const CFG={
resume:"vignesh's resume.pdf",            /* PDF next to this HTML file */
paper:"ACI-08-2026-0669_Proof_hi.pdf",     /* PDF next to this HTML file */

};
const pdf=f=>encodeURI(f).replace(/'/g,"%27");
const IC={
ig:'<rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><path d="M17.6 6.4h.01"/>',
li:'<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
gh:'<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.3 6.4-1.5 6.4-7A5.4 5.4 0 0 0 20 4.8 5.1 5.1 0 0 0 19.9 1S18.7.7 16 2.5a13.4 13.4 0 0 0-7 0C6.3.7 5.1 1 5.1 1A5.1 5.1 0 0 0 5 4.8a5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.3 6.600 6.400 7A3.400 3.400 0 0 0 9 18.100V22"/>',
pin:'<circle cx="12" cy="12" r="10"/><path d="M11 21l1.6-7.500"/><path d="M9.200 13.500c-1.800-3.800 1-7.500 4.800-6.500s2.800 7-1.200 7c-1 0-1.800-.5-2.300-1.300"/>'};
IC.md='<path d="M3 6v12M3 6l4.500 8L12 6v12M17 6v12M21 6v12"/>';
const SOC=[["Instagram",`https://www.instagram.com/${CFG.ig}/`,IC.ig],["LinkedIn",`https://www.linkedin.com/in/${CFG.li}`,IC.li],["GitHub",`https://github.com/${CFG.gh}`,IC.gh],["Pinterest",`https://in.pinterest.com/${CFG.pin}/`,IC.pin],["Medium",`https://medium.com/@${CFG.md}`,IC.md]];

/* ===== Dot-matrix display (canvas port of the Matrix component) ===== */
const MX=(()=>{const cv=document.getElementById("mx"),cx=cv.getContext("2d"),D=[0x7B6F,0x2C97,0x73E7,0x73CF,0x5BC9,0x79CF,0x79EF,0x7249,0x7BEF,0x7BCF];
let gi=-1,W,H,R,C,P=15,b=new Float32Array(1),pat="wave",ink="#888",rip=[],mp=null,last=0,hi=0,ox=0,oy=0;
const play=!matchMedia("(prefers-reduced-motion:reduce)").matches,M=(x,n)=>((x%n)+n)%n;
const HOME=["boxes","spiral","rain","pulse","clock","vu","wave","snake","loader","chevron"];
/* per-page: [pattern, opacity, fade-mask] */
const CF={home:["wave",.62,0],education:["clock",.13,1],research:["vu",.16,1],linkedin:["wave",.13,1],artworks:["pulse",.15,1],projects:["loader",.13,1],credentials:["snake",.12,1],resume:["chevron",.13,1],experience:["pulse",.12,1]};
const HX=(a,b,c)=>{const x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x)};
const GL=["#####/#..../#..../#..../#....", "....#/....#/....#/....#/#####", "....#/...../....#/...../#.#.#", "....#/...#./..#../.#.../#....", "#..../.#.../..#../...#./....#", "...../...../...../...../....#", "#.#.#/...../#.#.#/...../#.#.#", "#.#.#/...../#..../...../#....", "#####/#..../#.###/#.#../#.#.#", "#.#.#/.#.#./#.#.#/.#.#./#.#.#", "#####/#####/#####/#####/#####", "#####/...../#####/...../#####", "#.#.#/#.#.#/#.#.#/#.#.#/#.#.#", "#.#.#/#####/#.#.#/#####/#.#.#", "..###/.#.../#..../#..../#...#", "#####/#...#/#...#/#...#/#####", "#...#/.#..#/..#.#/...##/#####", "##.../##.../...../...../....#", "#.#.#/...../#..../...##/...##", "....#/...#./..#.#/.#.#./#.#..", "#####/#####/##.../##.../##...", "..#../...#./..###/.##.#/#####/#.###/#.#../...##/....."].map(g=>{let r=g.split("/");if(r.length==5)r=r.concat(r.slice(0,4).reverse());return r.map(x=>x+x.slice(0,4).split("").reverse().join(""))});
const PT={
wave:(r,c,t)=>{const y=R/2+Math.sin(c*.2-t*2.4)*R*.2+Math.sin(c*.07+t)*R*.12;return Math.max(0,1-Math.abs(r-y)/3.2)},
pulse:(r,c,t)=>Math.max(0,Math.sin(Math.hypot(c-C/2,(r-R/2)*1.15)*.38-t*3.2))**4,
loader:(r,c,t)=>{const q=Math.min(R,C),d=Math.hypot(c-C/2,r-R/2);if(d>q*.44||d<q*.3)return 0;return Math.max(0,1-M(Math.atan2(r-R/2,c-C/2)-t*2.2,6.2832)/2.6)},
snake:(r,c,t)=>{const n=R*C,d=M(t*70-(r*C+(r%2?C-1-c:c)),n);return d<46?1-d/46:0},
vu:(r,c,t)=>{const l=(Math.sin(c*.7+t*3)+Math.sin(c*1.9-t*2.1)+Math.sin(c*.23+t*.9)+3)/6*R*.85;return c%2?0:(R-r<=l?.35+.65*(1-(R-r)/Math.max(l,1)):0)},
glyphs:(r,c,t)=>{const x=c-((C%10)>>1),y=r-((R%10)>>1);if(x<0||y<0)return 0;const lx=x%10,ly=y%10;if(lx>8||ly>8)return 0;const bx=(x/10)|0,by=(y/10)|0,q=t/(3+HX(bx,by,1)*4)+HX(bx,by,2)*9,n=Math.floor(q),u=q-n;if(HX(bx,by,n+3)>.55)return 0;const g=gi<0?Math.floor(HX(bx,by,n+5)*GL.length):gi;if(GL[g][ly][lx]!="#")return 0;return u<.12?u/.12:u<.6?1:Math.max(0,1-(u-.6)/.3)},
boxes:(r,c,t)=>{const lx=c%4,ly=r%4;if(lx==3||ly==3)return 0;const bx=c>>2,by=r>>2,q=t/(2.4+HX(bx,by,1)*3)+HX(bx,by,2)*9,n=Math.floor(q),u=q-n;if(HX(bx,by,n+3)>.28)return 0;return u<.12?u/.12:Math.max(0,1-(u-.12)/.55)},
spiral:(r,c,t)=>Math.max(0,Math.sin(Math.hypot(c-C/2,(r-R/2)*1.1)*.42+Math.atan2(r-R/2,c-C/2)*2-t*2.6))**3,
rain:(r,c,t)=>{const h=(c*7919%13)/13,d=M(t*(5+h*9)+c*37,R+14)-r;return d>=0&&d<9?1-d/9:0},
chevron:(r,c,t)=>M(c-Math.abs(r-R/2)-t*9,9)<2.2?1:0,
clock:(r,c,t)=>{const d=new Date(),s=[d.getHours()/10|0,d.getHours()%10,d.getMinutes()/10|0,d.getMinutes()%10],k=Math.max(1,Math.min(C*.8/17,R*.55/5)|0),x=Math.floor((c-((C-17*k)>>1))/k),y=Math.floor((r-((R-5*k)>>1))/k),q=[0,4,10,14];
if(x<0||x>16||y<0||y>4)return 0;if(x==8)return(y==1||y==3)?(d.getSeconds()%2?1:.35):0;let i=-1;for(let j=0;j<4;j++)if(x>=q[j]&&x<q[j]+3)i=j;return i<0?0:(D[s[i]]>>(14-(y*3+x-q[i])))&1}};
function size(){const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);P=W<600?12:W>1600?18:15;C=Math.ceil(W/P);R=Math.ceil(H/P);ox=(W-C*P)/2;oy=(H-R*P)/2;b=new Float32Array(R*C);draw(performance.now()/1e3)}
function draw(t){const f=PT[pat],now=performance.now(),rad=P*.32;rip=rip.filter(o=>now-o.t<1800);cx.clearRect(0,0,W,H);cx.fillStyle=ink;let i=0;
for(let r=0;r<R;r++)for(let c=0;c<C;c++,i++){let v=f(r,c,t);
for(const o of rip){const a=(now-o.t)/1000;v+=Math.max(0,1-Math.abs(Math.hypot(c-o.c,r-o.r)-a*32)/2.5)*(1-a/1.8)}
